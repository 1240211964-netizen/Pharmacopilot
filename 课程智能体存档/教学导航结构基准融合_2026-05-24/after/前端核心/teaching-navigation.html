<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PharmacoPilot | 教学导航工作台</title>
    <meta name="description" content="面向新教师的药事管理课程教学导航工作台，按课前、课中、课后推进证据化教学设计、实施与复盘。" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./pharmacopilot-design-system.css" />
    <link rel="stylesheet" href="./teaching-navigation-productized.css" />
    <script defer src="./wenda-env.js"></script>
    <script defer src="./teaching-navigation-contract.js"></script>
    <script defer src="./teaching-navigation-productized.js"></script>
  </head>
  <body data-page="teaching-navigation">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="./index.html" aria-label="PharmacoPilot 课程智能体首页">
          <span class="brand-mark" aria-hidden="true"><span class="brand-monogram">P</span></span>
          <span class="brand-lockup">
            <span class="brand-wordmark">PharmacoPilot</span>
            <span class="brand-submark">课程智能体</span>
          </span>
        </a>
        <button class="nav-menu-toggle" id="navMenuToggle" type="button" aria-label="打开导航菜单" aria-controls="homeNavGroup" aria-expanded="false"><span aria-hidden="true"></span></button>
        <div class="home-nav-group" id="homeNavGroup">
          <nav class="topnav" id="primaryNav" aria-label="页面导航">
            <a class="nav-link" data-nav="home" href="./index.html">首页</a>
            <a class="nav-link active" data-nav="teaching-navigation" href="./teaching-navigation.html">教学导航</a>
            <a class="nav-link" data-nav="practice" href="./practice.html">教学实践</a>
            <a class="nav-link" data-nav="assets" href="./teaching-data.html">教学数据</a>
            <a class="nav-link" data-nav="docs" href="https://github.com/1240211964-netizen/Pharmacopilot" target="_blank" rel="noreferrer">文档</a>
          </nav>
          <div class="top-actions home-auth-actions" aria-label="账号与授权入口">
            <a class="nav-outline-action" href="./auth.html?mode=login">登录</a>
            <a class="nav-outline-action" href="./auth.html?provider=github" data-auth-provider="github">GitHub</a>
            <a class="nav-primary-action nav-fanya-action" href="about:blank" target="_blank" rel="noreferrer" data-wenda-platform-auth aria-label="泛雅，暂时打开闻道平台授权界面">泛雅</a>
          </div>
        </div>
      </div>
    </header>

    <main class="nav-shell">
      <section class="nav-intro" aria-label="教学导航说明">
        <div class="intro-card">
          <span class="eyebrow">教学导航</span>
          <h1>按课前、课中、课后，完成一节药事管理课。</h1>
          <p>每一站只做一个判断：看图、选择、生成产物。理论依据和后台检查点不放在主界面，环节地图保留为本页核心导航。</p>
        </div>
        <aside class="context-strip" aria-label="课程上下文">
          <div>
            <span>示例课程</span>
            <strong>管理学原理 · SWOT 分析</strong>
          </div>
          <label>
            <span>案例语境</span>
            <select id="scenarioSelect" aria-label="选择药事管理案例语境"></select>
          </label>
          <div>
            <span>进度</span>
            <strong id="progressText">0 / 10</strong>
          </div>
        </aside>
      </section>

      <div class="flow-strip" aria-label="主交互流程">
        <span>证据图</span>
        <span>判断题</span>
        <span>反馈</span>
        <span>产物</span>
        <span>保存资产</span>
        <strong>证据图 → 判断题 → 反馈 → 产物 → 保存资产</strong>
      </div>

      <section class="route-panel" aria-label="课前课中课后三时段导航">
        <div id="phaseTabs" class="phase-tabs"></div>
        <div id="stationChips" class="station-chips station-map"></div>
      </section>

      <section class="focus-workbench" aria-label="当前任务站工作台">
        <article class="station-cover" aria-label="当前任务站">
          <div>
            <span id="phasePill" class="phase-pill"></span>
            <h2 id="activeTitle"></h2>
            <p id="activeTask"></p>
          </div>
          <details class="context-drawer">
            <summary>本站依据</summary>
            <div id="stationRationale"></div>
          </details>
        </article>

        <section class="decision-workspace" aria-label="一图一题工作区">
          <article id="evidenceFigure" class="evidence-figure"></article>
          <article id="decisionPanel" class="decision-panel"></article>
        </section>

        <article id="feedbackPanel" class="feedback-panel" aria-live="polite"></article>

        <article class="artifact-panel" aria-label="生成教学产物">
          <div class="panel-head compact">
            <div>
              <span class="eyebrow">节点产物</span>
              <h2 id="artifactTitle">生成本站产物</h2>
            </div>
            <div class="artifact-actions">
              <button id="generateArtifactBtn" class="ghost-btn" type="button">生成</button>
              <button id="saveAssetBtn" class="ghost-btn" type="button">保存资产</button>
              <button id="nextStationBtn" class="primary-btn" type="button">下一站</button>
            </div>
          </div>
          <details id="artifactDrawer" class="artifact-drawer">
            <summary id="artifactSummary">查看 / 编辑产物草稿</summary>
            <textarea id="artifactText" aria-label="本站产物草稿"></textarea>
          </details>
        </article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
